<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quest Compass</title>

    <!--
    Main stylesheet.

    Keeps ALL visual styling out of the HTML.
    -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>🧭 Quest Compass</h1>
        <p class="version">v0.3</p>

        <!--
        GPS Card

        Displays current GPS information.
        -->
        <section class="card">

            <h2>GPS</h2>

            <p id="status">
                GPS inactive
            </p>

            <div id="coords">
                Waiting for GPS...
            </div>

            <button id="gpsButton">
                Enable GPS
            </button>

            <button id="saveButton">
                Save Current Location
            </button>

        </section>

        <!--
        Saved Locations

        Populated automatically from storage.js
        -->
        <section class="card">

            <h2>Saved Locations</h2>

            <div id="savedLocations">

            </div>

            <button id="clearButton" class="danger">
                Clear All Saved Locations
            </button>

        </section>

    </div>

    <!--
    Storage system.

    Handles saving and loading locations.
    -->
    <script src="storage.js"></script>

    <!--
    Main application logic.
    -->
    <script src="app.js"></script>

</body>

</html>
