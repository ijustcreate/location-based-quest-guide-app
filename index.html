<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Compass</title>

    <!-- Styles stay in their own file so this file only handles layout. -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>🧭 Quest Compass</h1>
        <p class="version">Version 0.3 — Navigation</p>

        <section class="card">
            <h2>GPS</h2>

            <p id="status">GPS inactive</p>

            <div id="coords">
                Waiting for GPS...
            </div>

            <button id="gpsButton">
                Enable GPS
            </button>

            <button id="saveButton">
                Save Current Location
            </button>
        </section>

        <section class="card" id="navigationCard">
            <h2>Current Target</h2>

            <div id="targetInfo">
                No target selected.
            </div>

            <div id="directionArrow">
                ↑
            </div>

            <div id="navigationInfo">
                Choose a saved location to navigate.
            </div>
        </section>

        <section class="card">
            <h2>Saved Locations</h2>

            <div id="savedLocations"></div>

            <button id="clearButton" class="danger">
                Clear All Saved Locations
            </button>
        </section>

    </div>

    <!-- Storage loads first because app.js depends on it. -->
    <script src="storage.js"></script>

    <!-- Navigation loads before app.js because app.js uses the navigation math. -->
    <script src="navigation.js"></script>

    <!-- Main app behavior. -->
    <script src="app.js"></script>

</body>

</html>
